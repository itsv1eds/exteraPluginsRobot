services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: extera-plugins-bot
    restart: unless-stopped
    command: ["python", "main.py"]
    environment:
      DATA_DIR: /app/data
    network_mode: bridge
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    volumes:
      - ./data:/app/data
      - ./sessions:/app/sessions

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: extera-plugins-auth
    profiles: ["tools"]
    command: ["python", "-m", "scripts.auth"]
    stdin_open: true
    tty: true
    environment:
      DATA_DIR: /app/data
    network_mode: bridge
    volumes:
      - ./data:/app/data
      - ./sessions:/app/sessions
